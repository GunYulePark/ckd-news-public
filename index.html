<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CKD News Monitor</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --chip: #eef2ff;
      --chip-text: #3730a3;
      --accent: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 16px 56px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px 130px;
      gap: 10px;
      margin-bottom: 14px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus {
      border-color: #9ca3af;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      overflow: hidden;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      background: #fafafa;
      white-space: nowrap;
    }

    tr:hover td {
      background: #fcfcfd;
    }

    .date { width: 120px; white-space: nowrap; color: var(--muted); }
    .company { width: 130px; }
    .link { width: 70px; white-space: nowrap; }

    .title {
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .summary {
      color: #4b5563;
      font-size: 13px;
    }

    .source {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--chip-text);
      font-size: 12px;
      font-weight: 700;
      margin: 0 4px 4px 0;
      white-space: nowrap;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .empty {
      padding: 40px 12px;
      text-align: center;
      color: var(--muted);
    }

    .search-help { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .pager { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .pager:empty { display: none; }
    .pager button { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .pager button:disabled { color: #9ca3af; cursor: default; background: #f9fafb; }
    .pager span { color: var(--muted); font-size: 13px; }

    footer {
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 12px;
        overflow: hidden;
        background: #fff;
      }

      td {
        border-bottom: none;
        padding: 10px 12px;
      }

      .date, .company, .link {
        width: auto;
      }

      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CKD News Monitor</h1>
      <p class="desc"></p>
    </header>

    <section class="panel">
      <div class="tabs">
        <button id="sentTab" class="tab-btn active" type="button">발송 뉴스</button>
        <button id="watchTab" class="tab-btn" type="button">미발송 주요 이슈</button>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="제목, 요약, 회사명, 매체 검색" aria-label="이력 검색" />
        <select id="companyFilter" aria-label="회사 필터">
          <option value="">전체 회사</option>
        </select>
        <select id="pageSize" aria-label="페이지당 표시 건수">
          <option value="50">50건씩 보기</option>
          <option value="100">100건씩 보기</option>
        </select>
      </div>

      <p class="search-help">검색은 선택한 탭의 전체 보관 이력에 적용됩니다. 화면에는 50건 또는 100건씩 나누어 표시합니다.</p>

      <div class="meta-row">
        <div id="countText" role="status" aria-live="polite">불러오는 중...</div>
        <div id="updatedText"></div>
      </div>

      <nav id="pagerTop" class="pager" aria-label="위쪽 이력 페이지"></nav>
      <div id="tableRoot"></div>
      <nav id="pagerBottom" class="pager" aria-label="아래쪽 이력 페이지"></nav>
    </section>

    <footer>
      Public news only. Internal notes, API keys and recipients are not included.
    </footer>
  </div>

  <script>
    const DATA_URL = './data/public_news.json';
    let sentItems = [];
    let watchItems = [];
    let currentTab = 'sent';
    let currentPage = 1;
    let searchTimer;

    const sentTab = document.getElementById('sentTab');
    const watchTab = document.getElementById('watchTab');
    const searchInput = document.getElementById('searchInput');
    const companyFilter = document.getElementById('companyFilter');
    const countText = document.getElementById('countText');
    const updatedText = document.getElementById('updatedText');
    const tableRoot = document.getElementById('tableRoot');
    const pageSize = document.getElementById('pageSize');
    const pagers = [document.getElementById('pagerTop'), document.getElementById('pagerBottom')];

    async function init() {
      try {
        const response = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!response.ok) throw new Error('데이터 파일을 불러오지 못했습니다.');

        const data = await response.json();
        sentItems = Array.isArray(data.items) ? data.items : [];
        watchItems = Array.isArray(data.watchItems) ? data.watchItems : [];

        renderMeta(data);
        setupFilters([...sentItems, ...watchItems]);
        render();
      } catch (error) {
        countText.textContent = '데이터 로딩 실패';
        tableRoot.innerHTML = '<div class="empty">' + escapeHtml(error.message) + '</div>';
      }
    }

    function renderMeta(data) {
      const updatedAt = data.generatedAt ? new Date(data.generatedAt) : null;
      updatedText.textContent = updatedAt && !Number.isNaN(updatedAt.getTime())
        ? '업데이트: ' + formatDate(updatedAt)
        : '';
    }

    function setupFilters(items) {
      const companies = unique(items.map(item => item.company).filter(Boolean));

      companies.forEach(company => {
        const option = document.createElement('option');
        option.value = company;
        option.textContent = company;
        companyFilter.appendChild(option);
      });
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const company = companyFilter.value;
      const allItems = currentTab === 'watch' ? watchItems : sentItems;

      sentTab.classList.toggle('active', currentTab === 'sent');
      watchTab.classList.toggle('active', currentTab === 'watch');

      const filtered = allItems.filter(item => {
        const itemCompany = item.company || '';
        const haystack = [
          item.title,
          item.summary,
          item.source,
          itemCompany
        ].join(' ').toLowerCase();

        if (q && !haystack.includes(q)) return false;
        if (company && itemCompany !== company) return false;
        return true;
      });

      const size = Number(pageSize.value);
      const totalPages = Math.max(1, Math.ceil(filtered.length / size));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const start = (currentPage - 1) * size;
      const visibleItems = filtered.slice(start, start + size);
      countText.textContent =
        (currentTab === 'watch' ? '미발송 주요 이슈 ' : '발송 뉴스 ') +
        '전체 ' + allItems.length.toLocaleString('ko-KR') + '건 · 검색 결과 ' +
        filtered.length.toLocaleString('ko-KR') + '건' +
        (filtered.length ? ' · ' + (start + 1) + '–' + (start + visibleItems.length) + '건 표시' : '');

      renderPagination(totalPages, filtered.length);

      if (filtered.length === 0) {
        tableRoot.innerHTML = '<div class="empty">' +
          (currentTab === 'watch' ? '표시할 미발송 주요 이슈가 없습니다.' : '표시할 발송 뉴스가 없습니다.') +
          '</div>';
        return;
      }

      tableRoot.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>일시</th>
              <th>회사</th>
              <th>뉴스</th>
              <th>링크</th>
            </tr>
          </thead>
          <tbody>
            ${visibleItems.map(renderRow).join('')}
          </tbody>
        </table>
      `;
    }

    function renderPagination(totalPages, totalItems) {
      const html = totalItems === 0 ? '' :
        `<button type="button" data-page="1" ${currentPage === 1 ? 'disabled' : ''}>처음</button>
         <button type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>이전</button>
         <span>${currentPage.toLocaleString('ko-KR')} / ${totalPages.toLocaleString('ko-KR')} 페이지</span>
         <button type="button" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>
         <button type="button" data-page="${totalPages}" ${currentPage === totalPages ? 'disabled' : ''}>마지막</button>`;
      pagers.forEach(pager => { pager.innerHTML = html; });
    }

    function renderRow(item) {
      const companyText = item.company || '';
      const dateText = item.pubDate ? formatDate(new Date(item.pubDate)) : '';
      const link = item.link || '#';

      return `
        <tr>
          <td class="date" data-label="일시">${escapeHtml(dateText)}</td>
          <td class="company" data-label="회사">${escapeHtml(companyText)}</td>
          <td data-label="뉴스">
            <div class="title">${escapeHtml(item.title || '')}</div>
            <div class="summary">${escapeHtml(item.summary || '')}</div>
            <div class="source">${escapeHtml(item.source || '')}</div>
          </td>
          <td class="link" data-label="링크"><a href="${escapeAttribute(link)}" target="_blank" rel="noopener noreferrer">열기</a></td>
        </tr>
      `;
    }

    function unique(list) {
      return Array.from(new Set(list)).sort((a, b) => a.localeCompare(b, 'ko'));
    }

    function formatDate(date) {
      if (!date || Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    sentTab.addEventListener('click', () => {
      currentTab = 'sent';
      currentPage = 1;
      render();
    });

    watchTab.addEventListener('click', () => {
      currentTab = 'watch';
      currentPage = 1;
      render();
    });

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { currentPage = 1; render(); }, 150);
    });
    companyFilter.addEventListener('change', () => { currentPage = 1; render(); });
    pageSize.addEventListener('change', () => { currentPage = 1; render(); });
    pagers.forEach(pager => pager.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]');
      if (!button || button.disabled) return;
      currentPage = Number(button.dataset.page);
      render();
      pagers[0].scrollIntoView({ block: 'nearest' });
    }));

    init();
  </script>
</body>
</html>
